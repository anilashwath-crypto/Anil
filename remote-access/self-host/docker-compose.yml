# Optional: your own RustDesk ID + relay server (instead of the free public one).
# Run on an always-on box with a public IP or port-forwarded router:
#   docker compose up -d
#   cat data/id_ed25519.pub        # this is the KEY for the install scripts
# Open TCP 21115-21117 and UDP 21116 on the firewall/router.
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbs
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: hbbr
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
